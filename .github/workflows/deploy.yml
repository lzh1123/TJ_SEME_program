name: Deploy to Huawei Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: slideon-frontend/package-lock.json

      - name: Build frontend
        run: |
          cd slideon-frontend
          npm ci
          npm run build

      - name: Upload frontend dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "slideon-frontend/dist/*"
          target: "/tmp/slideon-dist"
          strip_components: 2
          overwrite: true

      - name: Deploy backend and restart services
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROJECT_DIR: ${{ secrets.SERVER_PROJECT_DIR }}
          FRONTEND_DEPLOY_DIR: ${{ secrets.FRONTEND_DEPLOY_DIR }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          BAIDU_SEARCH_API_KEY: ${{ secrets.BAIDU_SEARCH_API_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: PROJECT_DIR,FRONTEND_DEPLOY_DIR,DATABASE_URL,JWT_SECRET_KEY,DEEPSEEK_API_KEY,QWEN_API_KEY,KIMI_API_KEY,BAIDU_SEARCH_API_KEY
          script: |
            set -e
            PROJECT_DIR="${PROJECT_DIR:-/root/TJ_SEME_program}"
            FRONTEND_DEPLOY_DIR="${FRONTEND_DEPLOY_DIR:-/var/www/slideon}"

            cd "$PROJECT_DIR"
            git fetch origin main
            git reset --hard origin/main

            mkdir -p backend
            touch backend/.env
            upsert_env() {
              key="$1"
              value="$2"
              if [ -z "$value" ]; then
                return 0
              fi
              if grep -q "^${key}=" backend/.env; then
                sed -i "s|^${key}=.*|${key}=${value}|" backend/.env
              else
                echo "${key}=${value}" >> backend/.env
              fi
            }
            upsert_env DATABASE_URL "$DATABASE_URL"
            upsert_env JWT_SECRET_KEY "$JWT_SECRET_KEY"
            upsert_env DEEPSEEK_API_KEY "$DEEPSEEK_API_KEY"
            upsert_env QWEN_API_KEY "$QWEN_API_KEY"
            upsert_env KIMI_API_KEY "$KIMI_API_KEY"
            upsert_env BAIDU_SEARCH_API_KEY "$BAIDU_SEARCH_API_KEY"

            cd backend
            python3 -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple --timeout 120 -r requirements.txt
            python3 -m alembic upgrade head

            OLD_PIDS="$(pgrep -f 'python3 -m uvicorn ppt_backend.api.main:app' || true)"
            if [ -n "$OLD_PIDS" ]; then
              kill $OLD_PIDS
              sleep 2
            fi
            HF_ENDPOINT=https://hf-mirror.com nohup python3 -m uvicorn ppt_backend.api.main:app --host 0.0.0.0 --port 8000 > /tmp/slideon.log 2>&1 &

            if [ "$FRONTEND_DEPLOY_DIR" = "/" ] || [ -z "$FRONTEND_DEPLOY_DIR" ]; then
              echo "Invalid FRONTEND_DEPLOY_DIR"
              exit 1
            fi
            mkdir -p "$FRONTEND_DEPLOY_DIR"
            rm -rf "$FRONTEND_DEPLOY_DIR"/*
            cp -r /tmp/slideon-dist/* "$FRONTEND_DEPLOY_DIR"/

            nginx -t
            systemctl reload nginx
            curl -fsS http://127.0.0.1:8000/health
