name: Deploy to Huawei Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: slideon-frontend/package-lock.json

      - name: Build frontend
        run: |
          cd slideon-frontend
          npm ci
          npm run build

      - name: Upload frontend dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "slideon-frontend/dist/*"
          target: "/tmp/slideon-dist"
          strip_components: 2
          overwrite: true
          
      - name: Deploy backend and restart services
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROJECT_DIR: ${{ secrets.SERVER_PROJECT_DIR }}
          FRONTEND_DEPLOY_DIR: ${{ secrets.FRONTEND_DEPLOY_DIR }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          BAIDU_SEARCH_API_KEY: ${{ secrets.BAIDU_SEARCH_API_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: PROJECT_DIR,FRONTEND_DEPLOY_DIR,DATABASE_URL,JWT_SECRET_KEY,DEEPSEEK_API_KEY,QWEN_API_KEY,GLM_API_KEY,BAIDU_SEARCH_API_KEY
          script: |
            set -e

            PROJECT_DIR="${PROJECT_DIR:-/root/TJ_SEME_program}"
            FRONTEND_DEPLOY_DIR="${FRONTEND_DEPLOY_DIR:-/var/www/slideon}"

            cd "$PROJECT_DIR"

            git config --local http.version HTTP/1.1
            export GIT_LFS_SKIP_SMUDGE=1
            git fetch --prune origin main
            git reset --hard FETCH_HEAD
            unset GIT_LFS_SKIP_SMUDGE

            mkdir -p backend
            touch backend/.env

            python3 - <<'PY'
            from pathlib import Path
            import os

            env_file = Path("backend/.env")

            keys = [
                "DATABASE_URL",
                "JWT_SECRET_KEY",
                "DEEPSEEK_API_KEY",
                "QWEN_API_KEY",
                "GLM_API_KEY",
                "BAIDU_SEARCH_API_KEY",
            ]

            values = {key: os.environ.get(key, "") for key in keys}

            old_lines = (
                env_file.read_text(encoding="utf-8").splitlines()
                if env_file.exists()
                else []
            )

            new_lines = []
            updated_keys = set()

            for line in old_lines:
                key, sep, _ = line.partition("=")

                if sep and key in values and values[key]:
                    new_lines.append(f"{key}={values[key]}")
                    updated_keys.add(key)
                else:
                    new_lines.append(line)

            for key in keys:
                if values[key] and key not in updated_keys:
                    new_lines.append(f"{key}={values[key]}")

            env_file.write_text(
                "\n".join(new_lines) + "\n",
                encoding="utf-8",
            )
            PY

            cd "$PROJECT_DIR/backend"

            python3 -m pip install \
              -i https://pypi.tuna.tsinghua.edu.cn/simple \
              --timeout 120 \
              -r requirements.txt

            python3 -m alembic upgrade head

            PYTHON_BIN="$(command -v python3)"

            if [ -z "$PYTHON_BIN" ]; then
              echo "python3 was not found"
              exit 1
            fi

            cat > /etc/systemd/system/slideon-backend.service <<EOF
            [Unit]
            Description=Slideon FastAPI Backend
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=$PROJECT_DIR/backend
            Environment=HF_ENDPOINT=https://hf-mirror.com
            ExecStart=$PYTHON_BIN -m uvicorn ppt_backend.api.main:app --host 0.0.0.0 --port 8000
            Restart=on-failure
            RestartSec=3
            TimeoutStopSec=30

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable slideon-backend.service

            if ! systemctl restart slideon-backend.service; then
              echo "Backend service failed to restart."
              journalctl -u slideon-backend.service -n 100 --no-pager || true
              exit 1
            fi

            BACKEND_READY=0

            for attempt in $(seq 1 20); do
              if curl -fsS --max-time 3 http://127.0.0.1:8000/health > /dev/null; then
                BACKEND_READY=1
                break
              fi

              sleep 1
            done

            if [ "$BACKEND_READY" -ne 1 ]; then
              echo "Backend health check failed."
              journalctl -u slideon-backend.service -n 100 --no-pager || true
              exit 1
            fi

            if [ "$FRONTEND_DEPLOY_DIR" = "/" ] || [ -z "$FRONTEND_DEPLOY_DIR" ]; then
              echo "Invalid FRONTEND_DEPLOY_DIR"
              exit 1
            fi

            if [ ! -d /tmp/slideon-dist ]; then
              echo "/tmp/slideon-dist does not exist"
              exit 1
            fi

            mkdir -p "$FRONTEND_DEPLOY_DIR"

            find "$FRONTEND_DEPLOY_DIR" \
              -mindepth 1 \
              -maxdepth 1 \
              -exec rm -rf {} +

            cp -r /tmp/slideon-dist/. "$FRONTEND_DEPLOY_DIR"/

            nginx -t
            systemctl reload nginx

            echo "Deployment completed successfully."
